<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hediye Savaşı PRO</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050611;color:#fff;font-family:Arial,sans-serif}
body{display:flex;justify-content:center;align-items:center}#app{width:min(100vw,56.25vh);height:min(100vh,177.78vw);min-height:100vh;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 25%,#32206b 0,#15132f 28%,#080914 67%,#03040a)}
#stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:38px 38px;opacity:.12}
.top{text-align:center;padding:14px 10px 4px}.logo{font-size:25px;font-weight:1000;letter-spacing:2px;text-shadow:0 0 12px #a65cff,0 0 28px #6c35ff}.small{font-size:9px;color:#aeb3d2;letter-spacing:2px;margin-top:3px}
.card{position:relative;margin:8px 11px;padding:11px;border:1px solid #34355f;border-radius:17px;background:#0d1020dd;box-shadow:0 10px 35px #0009;z-index:2}.boss{text-align:center;padding-top:7px}
.name{font-size:17px;font-weight:900;color:#ffcb5c}.bossface{font-size:72px;line-height:78px;filter:drop-shadow(0 0 18px #ff2b68)}.level{font-size:10px;color:#9ea7c9;margin-bottom:5px}
.bar{height:17px;background:#272a3d;border-radius:20px;border:1px solid #4b4d69;overflow:hidden}#hp{height:100%;width:100%;background:linear-gradient(90deg,#ff285c,#ff5b3d,#ffc13d);transition:width .3s}
.hptext{font-size:12px;font-weight:900;margin-top:5px}#event{height:38px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;text-align:center;color:#ffd66d}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.stat{text-align:center;padding:8px 2px;background:#080b17;border:1px solid #262a49;border-radius:11px}.stat b{font-size:16px;display:block}.stat span{font-size:8px;color:#858eae}
h3{font-size:10px;color:#9da6c6;margin:0 0 6px;letter-spacing:1px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #20243d;padding:5px 2px;font-size:11px}.row:last-child{border:0}
#status{position:absolute;top:91px;right:10px;font-size:8px;padding:5px 8px;border-radius:20px;background:#171c2d;color:#8ef0ad;border:1px solid #2d6746;z-index:5}
#toast{position:absolute;top:118px;left:50%;transform:translateX(-50%);width:92%;padding:11px;border-radius:13px;text-align:center;font-weight:1000;background:#1b1238ee;border:1px solid #8e55ff;opacity:0;z-index:7;pointer-events:none}
#toast.show{animation:toast 1.5s ease}@keyframes toast{0%{opacity:0;transform:translate(-50%,-15px) scale(.9)}15%,80%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0}}
#flash{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;z-index:8;background:#ff235344;font-size:30px;font-weight:1000;text-shadow:0 3px 18px #000}
#flash.show{display:flex;animation:flash .65s}@keyframes flash{0%{opacity:0;transform:scale(.7)}30%{opacity:1;transform:scale(1.08)}100%{opacity:0;transform:scale(1)}}
.bottom{position:absolute;left:11px;right:11px;bottom:8px;text-align:center;color:#69718f;font-size:8px}
</style></head><body><div id="app"><div id="stars"></div>
<div class="top"><div class="logo">🔥 HEDİYE SAVAŞI</div><div class="small">BOSS RAID • LIVE EDITION</div></div>
<div id="status">● BAĞLANIYOR</div>
<div class="card boss"><div class="name" id="bossName">👹 GÖLGE KRAL</div><div class="level" id="level">SEVİYE 1</div><div class="bossface" id="face">👹</div>
<div class="bar"><div id="hp"></div></div><div class="hptext"><span id="hpnum">10.000</span> / <span id="max">10.000</span> HP</div><div id="event">🎁 TikTok hediyeleri bekleniyor...</div></div>
<div class="card stats"><div class="stat"><b id="damage">0</b><span>TOPLAM HASAR</span></div><div class="stat"><b id="combo">0</b><span>COMBO</span></div><div class="stat"><b id="gifts">0</b><span>HEDİYE</span></div></div>
<div class="card"><h3>🏆 SON SALDIRANLAR</h3><div id="leaders"><div class="row"><span>Henüz hediye yok</span><b>—</b></div></div></div>
<div class="bottom">TikTok LIVE → Hediye → Boss saldırısı</div><div id="toast"></div><div id="flash">💥 KRİTİK VURUŞ!</div></div>
<script>
let maxHp=10000,hp=maxHp,total=0,combo=0,gifts=0,level=1,leaders=[];
const $=x=>document.getElementById(x);function fmt(n){return Math.round(n).toLocaleString("tr-TR")}
function render(){ $("hp").style.width=(hp/maxHp*100)+"%";$("hpnum").textContent=fmt(hp);$("max").textContent=fmt(maxHp);$("damage").textContent=fmt(total);$("combo").textContent=combo;$("gifts").textContent=fmt(gifts);$("level").textContent="SEVİYE "+level;$("face").textContent=hp/maxHp<.2?"😡":hp/maxHp<.5?"👹":"👺"}
function toast(msg,crit){$("event").textContent=msg;$("toast").textContent=msg;$("toast").classList.remove("show");void $("toast").offsetWidth;$("toast").classList.add("show");if(crit){$("flash").classList.remove("show");void $("flash").offsetWidth;$("flash").classList.add("show")}}
function leadersDraw(){$("leaders").innerHTML=leaders.slice(0,5).map((x,i)=>`<div class="row"><span>${i+1}. ${x.name}</span><b>${fmt(x.damage)}</b></div>`).join("")}
function gift(e){let diamonds=Number(e.diamondCount)||1,count=Number(e.repeatCount)||1;let dmg=Math.max(50,diamonds*100)*count;combo++;if(combo>=3)dmg=Math.round(dmg*(1+Math.min(combo-2,5)*.1));let crit=Math.random()<.1;if(crit)dmg*=2;hp=Math.max(0,hp-dmg);total+=dmg;gifts+=count;leaders.push({name:e.user||"İzleyici",damage:dmg});leaders.sort((a,b)=>b.damage-a.damage);toast(`🎁 ${e.giftName||"Hediye"} • ${e.user||"İzleyici"} → -${fmt(dmg)} HP`,crit);render();leadersDraw();if(hp===0){level++;maxHp=Math.round(10000*Math.pow(1.45,level-1));hp=maxHp;combo=0;setTimeout(()=>toast("🏆 BOSS DEVRİLDİ! YENİ BOSS!"),300)}}
const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
ws.onopen=()=>{$("status").textContent="● CANLI BAĞLI";$("status").style.color="#8ef0ad"};
ws.onclose=()=>{$("status").textContent="● BAĞLANTI YOK";$("status").style.color="#ff8b8b"};
ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==="gift")gift(m)}catch{}};
render();
</script></body></html>
